<svg class="closeToMeIcon" width="240" height="140" viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .petal-outline {
        fill: none;
        stroke: #4B4744;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .petal-accent {
        fill: #D8CEBA;
      }

      .petal-group {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 240ms ease-out;
      }

      .overlap-shape {
        fill: #D8CEBA;
        opacity: 0;
        transition: opacity 240ms ease-out;
      }
    </style>
  </defs>

  <!-- LEFT PETAL -->
  <g id="leftPetal" class="petal-group">
    <path class="petal-outline" d="M26 22
         C18 58, 20 95, 48 118
         C63 131, 82 136, 103 134
         C104 117, 103 97, 98 78
         C92 55, 77 36, 54 24
         C44 19, 35 18, 26 22 Z"></path>
    <path id="leftAccent" class="petal-accent" d="M96 134
         C96 122, 97 111, 99 100
         C103 105, 105 114, 105 128
         C102 131, 99 133, 96 134 Z"></path>
  </g>

  <!-- RIGHT PETAL -->
  <g id="rightPetal" class="petal-group" transform="translate(240 0) scale(-1 1)">
    <path class="petal-outline" d="M26 22
         C18 58, 20 95, 48 118
         C63 131, 82 136, 103 134
         C104 117, 103 97, 98 78
         C92 55, 77 36, 54 24
         C44 19, 35 18, 26 22 Z"></path>
    <path id="rightAccent" class="petal-accent" d="M96 134
         C96 122, 97 111, 99 100
         C103 105, 105 114, 105 128
         C102 131, 99 133, 96 134 Z"></path>
  </g>

  <!-- CENTRAL OVERLAP (for selected state) -->
  <path id="overlap" class="overlap-shape" d="M120 100
       C115 107, 113 115, 114 127
       C116 131, 118 134, 120 136
       C122 134, 124 131, 126 127
       C127 115, 125 107, 120 100 Z"></path>
</svg>